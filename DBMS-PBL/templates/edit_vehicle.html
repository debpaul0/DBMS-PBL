{% extends "base.html" %}{% block title %}Edit vehicle | TrafficSafe{% endblock %}{% block heading %}Edit vehicle{% endblock %}
{% block content %}<div class="form-card narrow"><h2>Update vehicle details</h2><form method="post" class="form-grid"><label>Registration number *<input name="registration_no" required value="{{ vehicle.registration_no }}"></label><label>Vehicle type *<select name="vehicle_type" required>{% for t in ['Car','Motorcycle','Bus','Truck','Auto-rickshaw','Other'] %}<option {% if vehicle.vehicle_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Linked driver<select name="driver_id"><option value="">No driver selected</option>{% for d in drivers %}<option value="{{ d.driver_id }}" {% if vehicle.driver_id==d.driver_id %}selected{% endif %}>{{ d.name }} — {{ d.license_no }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{{ url_for('vehicles') }}">Cancel</a></div></form></div>{% endblock %}

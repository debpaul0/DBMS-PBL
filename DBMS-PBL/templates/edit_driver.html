{% extends "base.html" %}{% block title %}Edit driver | TrafficSafe{% endblock %}{% block heading %}Edit driver{% endblock %}
{% block content %}<div class="form-card narrow"><h2>Update driver details</h2><form method="post" class="form-grid"><label>Full name *<input name="name" required value="{{ driver.name }}"></label><label>License number *<input name="license_no" required value="{{ driver.license_no }}"></label><label>Phone<input name="phone" value="{{ driver.phone or '' }}"></label><div class="form-actions"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{{ url_for('drivers') }}">Cancel</a></div></form></div>{% endblock %}

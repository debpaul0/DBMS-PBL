{% extends "base.html" %}{% block title %}Edit violation | TrafficSafe{% endblock %}{% block heading %}Edit violation{% endblock %}
{% block content %}<div class="form-card narrow"><h2>Update violation record</h2><form method="post" class="form-grid"><label>Vehicle *<select name="vehicle_id" required>{% for v in vehicles %}<option value="{{ v.vehicle_id }}" {% if record.vehicle_id==v.vehicle_id %}selected{% endif %}>{{ v.registration_no }}</option>{% endfor %}</select></label><label>Violation type *<select name="violation_type_id" required>{% for t in types %}<option value="{{ t.violation_type_id }}" {% if record.violation_type_id==t.violation_type_id %}selected{% endif %}>{{ t.violation_type }}</option>{% endfor %}</select></label><label>Date *<input type="date" name="violation_date" value="{{ record.violation_date }}" required></label><label>Location<input name="location" value="{{ record.location or '' }}"></label><label>Fine amount (₹) *<input type="number" name="fine_amount" min="0" step="0.01" value="{{ record.fine_amount }}" required></label><label>Status<select name="status"><option {% if record.status=='Unpaid' %}selected{% endif %}>Unpaid</option><option {% if record.status=='Paid' %}selected{% endif %}>Paid</option></select></label><div class="form-actions"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{{ url_for('violations') }}">Cancel</a></div></form></div>{% endblock %}
